<title>hello</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;

        background: #f5f5f0;
        color: #222;

        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        width: 90%;
        max-width: 720px;
    }

    h1 {
        font-size: 64px;
        font-weight: 500;
        letter-spacing: -3px;
        margin: 0 0 20px;
    }

    p {
        font-size: 20px;
        line-height: 1.6;
        color: #666;
        max-width: 580px;
        margin: 0 0 35px;
    }

    .line {
        width: 100%;
        height: 1px;
        background: #d6d6d0;
        margin-bottom: 25px;
    }

    .info {
        display: flex;
        justify-content: space-between;
        color: #888;
        font-size: 14px;
    }

    .status {
        color: #444;
    }

    .status::before {
        content: "";
        display: inline-block;
        width: 7px;
        height: 7px;
        background: #6b8f71;
        border-radius: 50%;
        margin-right: 8px;
    }

    footer {
        margin-top: 80px;
        font-size: 13px;
        color: #aaa;
    }
</style>
```

</head>

<body>

```
<main class="container">

    <h1>Hello, world.</h1>

    <p>
        This page is being served by a tiny HTTP server
        written from scratch in C.
    </p>

    <div class="line"></div>

    <div class="info">
        <span class="status">server running</span>
        <span>localhost:8080</span>
    </div>

    <footer>
